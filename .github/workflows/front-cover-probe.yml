name: Front cover probe

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/front-cover-probe.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify exact front cover bytes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib
          import struct

          path = Path('publication/assets/33669713-CC6F-48A1-A36D-E6D04200014A.png')
          data = path.read_bytes()
          if not data.startswith(b'\x89PNG\r\n\x1a\n'):
              raise SystemExit('FRONT_COVER_MIME_INVALID')
          if len(data) < 24 or data[12:16] != b'IHDR':
              raise SystemExit('FRONT_COVER_PNG_INVALID')
          width, height = struct.unpack('>II', data[16:24])
          print(f'FRONT_COVER_PATH={path.as_posix()}')
          print(f'FRONT_COVER_SHA256={hashlib.sha256(data).hexdigest()}')
          print(f'FRONT_COVER_BYTES={len(data)}')
          print(f'FRONT_COVER_WIDTH={width}')
          print(f'FRONT_COVER_HEIGHT={height}')
          print('FRONT_COVER_MIME=image/png')
          PY
