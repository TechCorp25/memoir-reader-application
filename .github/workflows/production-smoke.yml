name: Production deployment verification

on:
  workflow_run:
    workflows: ["Reader tests"]
    types: [completed]

permissions:
  contents: read

jobs:
  verify-production:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Wait for exact Render commit to become healthy
        env:
          EXPECTED_SHA: ${{ github.event.workflow_run.head_sha }}
          HEALTH_URL: https://memoir-reader-application.onrender.com/health
        run: |
          python3 - <<'PY'
          import json
          import os
          import time
          import urllib.error
          import urllib.request

          expected = os.environ["EXPECTED_SHA"]
          url = os.environ["HEALTH_URL"]
          last = None
          for attempt in range(1, 41):
              try:
                  request = urllib.request.Request(url, headers={"User-Agent": "memoir-reader-production-verifier/1.0"})
                  with urllib.request.urlopen(request, timeout=25) as response:
                      payload = json.loads(response.read().decode("utf-8"))
                  last = payload
                  healthy = payload.get("status") == "ok"
                  canonical = payload.get("canonical_source") == "techcorp-DevApps/memoir"
                  deployed = payload.get("application_commit") == expected
                  if healthy and canonical and deployed:
                      print(json.dumps(payload, indent=2, sort_keys=True))
                      print(f"Verified production commit {expected}")
                      raise SystemExit(0)
                  print(
                      f"Attempt {attempt}/40: status={payload.get('status')!r} "
                      f"application_commit={payload.get('application_commit')!r}; waiting for {expected}"
                  )
              except (OSError, urllib.error.URLError, json.JSONDecodeError) as exc:
                  last = {"request_error": str(exc)}
                  print(f"Attempt {attempt}/40: {exc}; waiting for Render")
              time.sleep(15)

          raise SystemExit(
              "Production did not reach the expected commit within the verification window. "
              f"expected={expected}; last={last!r}"
          )
          PY
