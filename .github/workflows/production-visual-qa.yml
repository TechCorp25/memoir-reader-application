name: Production physical-book visual QA

on:
  workflow_run:
    workflows: ["Production deployment verification"]
    types: [completed]

permissions:
  contents: read

jobs:
  visual-qa:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PRODUCTION_URL: https://memoir-reader-application.onrender.com
      EXPECTED_SHA: ${{ github.event.workflow_run.head_sha }}
      VISUAL_QA_OUTPUT: artifacts/visual-qa
    steps:
      - name: Check out verified application commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install browser QA runtime
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Run production physical-book QA
        run: node tests/production_visual_qa.mjs

      - name: Upload production screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-physical-book-visual-qa-${{ github.event.workflow_run.head_sha }}
          path: artifacts/visual-qa
          if-no-files-found: ignore
          retention-days: 14
