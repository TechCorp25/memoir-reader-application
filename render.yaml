services:
  - type: web
    name: memoir-reader-application
    runtime: python
    plan: free
    region: singapore
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --bind 0.0.0.0:$PORT --workers 2 --threads 4 --timeout 60 app:app
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: MEMOIR_REPO
        value: techcorp-DevApps/memoir
      - key: MEMOIR_REF
        value: main
      - key: SOURCE_CACHE_TTL_SECONDS
        value: "300"
